<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIX | Strong Button Hover</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css/">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <div class="container">
        <div class="my-github">
            <a class="my-github-link" href="https://github.com/Mohsen-NEGU/Creative-Hover-Buttons"><i class="icon-github"></i></a>
        </div>
        <div class="subtitle">Save These</div>
        <h1>Css Buttons</h1>
        <ul class="line">
            <li>
                <button class="btn-signup">
                    <span>S</span>
                    <span>i</span>
                    <span>g</span>
                    <span>n</span>
                    <span>u</span>
                    <span>p</span>
                </button>
                <button class="btn-login">
                    <span>Login</span>
                </button>  
            </li> 
            <li>
                <button class="btn-submit">
                    <span>Submit</span>
                </button>
                <button class="btn-next">
                    <span>Next<i class="icon-weather-windy"></i></span>
                </button>
            </li>
            <li>
                <button class="btn-explore">
                    <i class="icon-arrow-up-right2"></i>
                    <span><i class="icon-arrow-up-right2"></i>Explore</span>
                </button>
                <button class="btn-download">
                    <span>Download</span>
                    <i class="icon-download1"></i>
                </button>
            </li>
            <li>
                <button class="btn-send">
                    <i class="letter icon-send"></i>
                    <span class="send">Send</span>
                    <i class="checked icon-thumbs-up"></i>
                    <span class="sent-s">S</span>
                    <span class="sent-e">e</span>
                    <span class="sent-n">n</span>
                    <span class="sent-t">t</span>
                </button>
                <button class="btn-get-started">
                    <span>Get Started</span>
                </button>
            </li>
        </ul>
        <div class="caption">If you know of any other buttons with really insteresting hover effects , Id love for you to share them<i class="icon-heart-outline"></i>.</div>
    </div>
</body>
</html>
